<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wedding Invitation</title>
  <meta name="theme-color" content="#fbf7ef">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='25' cy='32' r='11' fill='none' stroke='%23a98445' stroke-width='3'/%3E%3Ccircle cx='39' cy='32' r='11' fill='none' stroke='%23a98445' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="frames/ezgif-frame-001.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="loading">
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader__inner">
      <p class="loader__pct" id="loaderPct">0%</p>
      <div class="loader__bar" aria-hidden="true"><span id="loaderBar"></span></div>
      <p class="loader__note" id="loaderNote">&nbsp;</p>
      <button type="button" class="enter" id="loaderEnter" hidden>Enter now</button>
    </div>
  </div>

  <main class="track" id="track">
    <div class="stage" id="stage">
      <canvas id="bgCanvas" class="stage__bg" aria-hidden="true"></canvas>
      <canvas id="canvas" class="stage__canvas" role="img" aria-label="Wedding invitation video that plays as you scroll"></canvas>
      <div class="cue" id="cue" aria-hidden="true"><span>Scroll to Begin</span><i></i></div>
    </div>
  </main>
  <noscript><p style="text-align:center;padding:20px">Please enable JavaScript to view this invitation.</p></noscript>
  <script src="js/main.js"></script>
</body>
</html>
